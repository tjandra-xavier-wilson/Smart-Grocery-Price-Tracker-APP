<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle grid aura -->
  <circle cx="256" cy="220" r="160" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Shopping Trolley Basket -->
  <g transform="translate(110, 120)" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trolley Handle & Frame -->
    <path d="M 10 30 L 50 30 L 95 200 L 250 200 L 285 70 L 65 70" fill="none" stroke-width="22"/>
    <!-- Basket Grid Lines -->
    <path d="M 85 110 L 275 110" fill="none" stroke="#94a3b8" stroke-width="12" stroke-dasharray="14 10"/>
    <path d="M 105 155 L 260 155" fill="none" stroke="#94a3b8" stroke-width="12" stroke-dasharray="14 10"/>
    <path d="M 140 70 L 155 200" fill="none" stroke="#94a3b8" stroke-width="12"/>
    <path d="M 210 70 L 215 200" fill="none" stroke="#94a3b8" stroke-width="12"/>
    <!-- Wheels -->
    <circle cx="115" cy="245" r="24" fill="#10b981" stroke="#f8fafc" stroke-width="12"/>
    <circle cx="235" cy="245" r="24" fill="#10b981" stroke="#f8fafc" stroke-width="12"/>
  </g>

  <!-- Budget Shield / Safety Cap Badge -->
  <g transform="translate(260, 240)">
    <!-- Glow -->
    <circle cx="80" cy="80" r="90" fill="#10b981" opacity="0.25" filter="url(#glow)"/>
    <!-- Shield Container -->
    <path d="M 80 15 L 145 45 C 145 110 115 150 80 170 C 45 150 15 110 15 45 Z" fill="url(#accentGrad)" stroke="#ecfdf5" stroke-width="10"/>
    <!-- Percent / Rupiah Sparkle inside shield -->
    <text x="80" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">Rp</text>
  </g>

  <!-- Savings Down Arrow (Promo Hunter) -->
  <g transform="translate(70, 75)">
    <circle cx="50" cy="50" r="42" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="6"/>
    <!-- Down Arrow -->
    <path d="M 50 28 L 50 68 M 34 52 L 50 68 L 66 52" stroke="#78350f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
